# SonarQube Cloud automatic analysis scope for BRVTAL.
# The GitHub App performs analysis; do not add a duplicate CI scanner while automatic analysis is enabled.
# Keep source and test roots disjoint. sonar.sources/sonar.tests accept simple paths only in automatic analysis.
sonar.sources=api,config,css,database,discadmin,js,scripts,index.html,index.php,sitemap.php
sonar.tests=tests
sonar.exclusions=discadmin/qrcode.min.js
sonar.sourceEncoding=UTF-8
# Keep Python analysis aligned with the Python runtime used by BRVTAL CI.
sonar.python.version=3.12
