name: Privacy audit

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: '41 7 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.event.issue.number == 736 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == '/privacy-audit')
    uses: pl0n3r/factory/.github/workflows/auditoria-privacidad.yml@dc7a24a7ff16aa01857009aff7f9e13b0bc0ca46
    with:
      kit_ref: fd4674c27e4bd54cce1a2d92e6432f845396fa71
      label_language: en
