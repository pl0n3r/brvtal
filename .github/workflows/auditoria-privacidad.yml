name: Privacy audit

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: '41 7 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.event.issue.number == 736 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == '/privacy-audit')
    uses: pl0n3r/factory/.github/workflows/auditoria-privacidad.yml@64e30344a1cd56e6d849552fd46ef13d2d0ecd24
    with:
      kit_ref: 64e30344a1cd56e6d849552fd46ef13d2d0ecd24
      label_language: en
