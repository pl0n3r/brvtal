name: Privacy audit

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: '41 7 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.event.issue.number == 736 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == '/privacy-audit')
    uses: pl0n3r/factory/.github/workflows/auditoria-privacidad.yml@5d1a211345c72f6a8743454ad68db7d20b62f19c
    with:
      kit_ref: 3341681fcc89bc46e752dd3f8f4093e831578c69
      label_language: en
