name: Fix Content Core API

on:
  push:
    branches: [feat/1-content-core]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-content-core
          fetch-depth: 0
      - name: Patch API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/index.php')
          s = p.read_text()
          old = "if(isset($d['status']) && !in_array($d['status'], $resource==='events'?['draft','published','upcoming','tickets_available','last_tickets','sold_out','cancelled','finished','archived']:['draft','published'], true))"
          new = "if(isset($d['status']) && !in_array($d['status'], $resource==='events'?['draft','published','upcoming','tickets_available','last_tickets','sold_out','cancelled','finished','archived']:($resource==='ticket_types'?['draft','active','inactive','sold_out']:['draft','published']), true))"
          if old in s:
              s = s.replace(old, new, 1)
          needle = "if(isset($d['platform']) && !in_array($d['platform'],['soundcloud','youtube','spotify','other'],true)) json_response(['ok'=>false,'error'=>'INVALID_PLATFORM'],422);"
          extra = "if($resource==='ticket_types' && isset($d['event_id']) && (int)$d['event_id']<1) json_response(['ok'=>false,'error'=>'INVALID_EVENT_ID'],422);\n    if($resource==='ticket_types' && isset($d['name']) && trim((string)$d['name'])==='') json_response(['ok'=>false,'error'=>'TICKET_NAME_REQUIRED'],422);"
          if extra not in s:
              s = s.replace(needle, needle + "\n    " + extra, 1)
          oldres = "$resources=['events','artists','sets','media','pages','settings'];"
          newres = "$resources=['events','artists','sets','media','pages','ticket_types','settings'];"
          if oldres in s:
              s = s.replace(oldres, newres, 1)
          p.write_text(s)
          PY
          php -l api/index.php
          grep -q "\$resources=.*ticket_types" api/index.php
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.php
          git rm .github/workflows/fix-content-core-api.yml
          git commit -m "fix: expose ticket type CRUD in Content Core API"
          git push origin HEAD:feat/1-content-core
