name: BRVTAL 1859 event first-view visual evidence

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'tests/e2e/public-event-first-view.spec.mjs'
      - '.github/workflows/issue-1859-visual-evidence.yml'

permissions:
  contents: read

jobs:
  captures:
    if: github.repository == 'pl0n3r/brvtal' && github.event.pull_request.number == 1873
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
      - name: Install test dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture synthetic before/after at 390 and 1440 pixels
        run: npx playwright test tests/e2e/public-event-first-view.spec.mjs --project=chromium --reporter=list
      - name: Publish reviewer-accessible PNG captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-1859-visual-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/issue-1859-visual/*
          if-no-files-found: error
          retention-days: 14
