name: Install shared DISCADMIN sidebar

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/install-shared-sidebar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sidebar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install shared sidebar on standalone admin screens
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('discadmin/content-core.php'),
              Path('discadmin/totp-status.php'),
          ]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if "admin-sidebar.php" in text:
                  continue

              if path.name == 'content-core.php':
                  old = "brvtal_admin_require();\n?>"
                  new = "brvtal_admin_require();\nrequire_once __DIR__ . '/../config/version.php';\n?>\n<?php require __DIR__ . '/admin-sidebar.php'; ?>"
              else:
                  old = "require_once __DIR__ . '/../config/totp.php';\n"
                  new = "require_once __DIR__ . '/../config/totp.php';\nrequire_once __DIR__ . '/../config/version.php';\n"
                  marker = "?>\n<!doctype html>"
                  replacement = "?>\n<?php require __DIR__ . '/admin-sidebar.php'; ?>\n<!doctype html>"
                  if marker in text:
                      text = text.replace(marker, replacement, 1)
                      path.write_text(text, encoding='utf-8')
                      continue

              if old not in text:
                  raise SystemExit(f'Expected insertion point not found in {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Validate PHP
        run: |
          php -l discadmin/admin-sidebar.php
          php -l discadmin/content-core.php
          php -l discadmin/totp-status.php

      - name: Commit sidebar integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- discadmin/admin-sidebar.php discadmin/content-core.php discadmin/totp-status.php; then
            echo 'Sidebar integration already current.'
            exit 0
          fi
          git config user.name 'BRVTAL Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discadmin/admin-sidebar.php discadmin/content-core.php discadmin/totp-status.php
          git commit -m 'feat: keep DISCADMIN sidebar visible across standalone screens [skip ci]'
          git push origin HEAD:main
