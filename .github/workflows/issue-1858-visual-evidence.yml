name: BRVTAL 1858 branded public 404 visual evidence

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.htaccess'
      - 'errors/404.php'
      - 'tests/e2e/public-404.spec.mjs'
      - '.github/workflows/issue-1858-visual-evidence.yml'

permissions:
  contents: read

jobs:
  captures:
    if: github.repository == 'pl0n3r/brvtal' && github.event.pull_request.number == 1871
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
      - name: Install test dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture actual live before and isolated Cromo after in 390/1440
        run: |
          php -l errors/404.php
          npx playwright test tests/e2e/public-404.spec.mjs --project=chromium --reporter=list
      - name: Verify four labeled PNG captures
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/issue-1858-visual
          for capture in before-live-390 before-live-1440 after-cromo-390 after-cromo-1440; do
            source="$(find test-results -type f -name "${capture}.png" -print -quit)"
            if [[ -z "$source" ]]; then
              echo "::error::Missing Playwright capture: ${capture}.png"
              exit 1
            fi
            cp "$source" "artifacts/issue-1858-visual/${capture}.png"
          done
          printf '{"head_sha":"%s","before_source":"read-only production response","after_source":"isolated PHP and synthetic HTTP-404 fixture","viewports":[390,1440],"production_after_merge_not_verified":true}\n' "$PR_HEAD_SHA" > artifacts/issue-1858-visual/manifest.json
      - name: Upload before/after captures for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-1858-404-ab-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/issue-1858-visual/*
          if-no-files-found: error
          retention-days: 14
