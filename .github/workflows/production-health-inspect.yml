name: Production Health Inspection (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-production-health-inspect
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect migrations without writes
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRVTAL_ORIGIN: https://www.brvtal.com.co
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Check out exact dispatch SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify owner, main and current exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || { echo "::error::Owner required"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Main required"; exit 1; }
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$GITHUB_SHA" ]] || { echo "::error::Dispatch SHA mismatch"; exit 1; }
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$sha" ]] || { echo "::error::Stale main; inspection denied"; exit 1; }
          version="$(php -r "require 'config/version.php'; echo BRVTAL_APP_VERSION;")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          echo "BRVTAL_EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "BRVTAL_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate read-only SSH transport
        run: python3 ops/factory/transport.py validate

      - name: Inspect sanitized migration plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/brvtal-health-inspect.json' EXIT
          python3 ops/factory/transport.py inspect-migrations \
            --sha "$BRVTAL_EXPECTED_SHA" \
            --version "$BRVTAL_EXPECTED_VERSION" \
            --origin "$BRVTAL_ORIGIN" \
            > /tmp/brvtal-health-inspect.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("/tmp/brvtal-health-inspect.json").read_text(encoding="utf-8"))
          fields = {"registry_exists", "record_registry_migration", "pending",
                    "baseline", "apply", "blocked", "actions", "proofs"}
          if not isinstance(plan, dict) or set(plan) != fields:
              raise SystemExit("Invalid sanitized inspection schema")
          for key in ("registry_exists", "record_registry_migration"):
              if type(plan[key]) is not bool:
                  raise SystemExit("Invalid sanitized registry state")
          for key in ("pending", "baseline", "apply", "blocked"):
              if not isinstance(plan[key], list) or len(plan[key]) > 200:
                  raise SystemExit("Invalid bounded migration counts")
          print("## BRVTAL production migration inspection (read-only)")
          print()
          print("- Result: **DIAGNOSTIC ONLY — NOT HEALTH GREEN**")
          print(f"- Checked commit: `{os.environ['BRVTAL_EXPECTED_SHA']}`")
          print(f"- Registry exists: **{plan['registry_exists']}**")
          print(f"- Registry record required: **{plan['record_registry_migration']}**")
          for name in ("pending", "baseline", "apply", "blocked"):
              print(f"- {name.capitalize()} count: **{len(plan[name])}**")
          print("- No migration statements, backup, deployment or reconciliation executed.")
          PY
