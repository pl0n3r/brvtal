name: Production Health Inspection (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-production-health-inspect
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect migrations without writes
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRVTAL_ORIGIN: https://www.brvtal.com.co

    steps:
      - name: Check out exact dispatch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify owner, main and current exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || { echo "::error::Owner required"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Main required"; exit 1; }
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" == "$GITHUB_SHA" ]] || { echo "::error::Dispatch SHA mismatch"; exit 1; }
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$sha" ]] || { echo "::error::Stale main; inspection denied"; exit 1; }
          version="$(php -r "require 'config/version.php'; echo BRVTAL_APP_VERSION;")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          echo "BRVTAL_SOURCE_MAIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "BRVTAL_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test offline inspection security contract
        shell: bash
        run: python3 -m unittest tests/test_production_health_inspect_workflow.py

      - name: Resolve trusted deployed identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deployment="$(mktemp)"
          trap 'rm -f "$deployment"' EXIT
          curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 5 --max-time 15 --max-filesize 16384 \
            -H "Accept: application/json" -H "Cache-Control: no-cache" \
            "$BRVTAL_ORIGIN/api/deployment.php?__factory_inspect=$GITHUB_RUN_ID" > "$deployment"
          deployed="$(python3 - "$deployment" "$BRVTAL_EXPECTED_VERSION" <<'PY'
          import json
          import re
          import sys

          def unique_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate key")
                  result[key] = value
              return result

          try:
              with open(sys.argv[1], "r", encoding="utf-8") as handle:
                  payload = json.load(handle, object_pairs_hook=unique_pairs)
              data = payload.get("data") if isinstance(payload, dict) else None
              if not isinstance(data, dict) or payload.get("ok") is not True:
                  raise ValueError("invalid envelope")
              sha = data.get("commit")
              if (data.get("exact") is not True
                      or data.get("source") != "git_checkout"
                      or data.get("version") != sys.argv[2]
                      or not isinstance(sha, str)
                      or re.fullmatch(r"[a-f0-9]{40}", sha) is None):
                  raise ValueError("untrusted deployment identity")
              print(sha)
          except (OSError, UnicodeError, ValueError, TypeError):
              sys.exit("Deployment identity invalid; inspection denied")
          PY
          )"
          [[ "$deployed" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid deployment SHA"; exit 1; }
          [[ "$(git cat-file -t "$deployed" 2>/dev/null)" == "commit" ]] || { echo "::error::Untrusted deployment commit"; exit 1; }
          git merge-base --is-ancestor "$deployed" "$BRVTAL_SOURCE_MAIN_SHA" || { echo "::error::Deployed SHA is not an ancestor of main"; exit 1; }
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$BRVTAL_SOURCE_MAIN_SHA" ]] || { echo "::error::Main changed during inspection preflight"; exit 1; }
          echo "BRVTAL_DEPLOYED_SHA=$deployed" >> "$GITHUB_ENV"

      - name: Validate read-only SSH transport
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: python3 ops/factory/transport.py validate

      - name: Inspect sanitized migration plan
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/brvtal-health-inspect.json' EXIT
          python3 ops/factory/transport.py inspect-migrations \
            --sha "$BRVTAL_DEPLOYED_SHA" \
            --version "$BRVTAL_EXPECTED_VERSION" \
            --origin "$BRVTAL_ORIGIN" \
            > /tmp/brvtal-health-inspect.json
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$BRVTAL_SOURCE_MAIN_SHA" ]] || { echo "::error::Main changed during SSH inspection"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("/tmp/brvtal-health-inspect.json").read_text(encoding="utf-8"))
          fields = {"registry_exists", "record_registry_migration", "pending",
                    "baseline", "apply", "blocked", "actions", "proofs"}
          if not isinstance(plan, dict) or set(plan) != fields:
              raise SystemExit("Invalid sanitized inspection schema")
          for key in ("registry_exists", "record_registry_migration"):
              if type(plan[key]) is not bool:
                  raise SystemExit("Invalid sanitized registry state")
          for key in ("pending", "baseline", "apply", "blocked"):
              if not isinstance(plan[key], list) or len(plan[key]) > 200:
                  raise SystemExit("Invalid bounded migration counts")
          print("## BRVTAL production migration inspection (read-only)")
          print()
          print("- Result: **DIAGNOSTIC ONLY — NOT HEALTH GREEN**")
          print(f"- Source main commit: `{os.environ['BRVTAL_SOURCE_MAIN_SHA']}`")
          print(f"- Deployed inspected commit: `{os.environ['BRVTAL_DEPLOYED_SHA']}`")
          print(f"- Registry exists: **{plan['registry_exists']}**")
          print(f"- Registry record required: **{plan['record_registry_migration']}**")
          for name in ("pending", "baseline", "apply", "blocked"):
              print(f"- {name.capitalize()} count: **{len(plan[name])}**")
          print("- No migration statements, backup, deployment or reconciliation executed.")
          PY
