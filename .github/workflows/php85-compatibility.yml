name: PHP 8.5 Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-php85-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php85:
    name: php85
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Verify PHP 8.5 runtime
        run: php -r 'if (PHP_VERSION_ID < 80500 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Expected PHP 8.5.x; got " . PHP_VERSION . PHP_EOL); exit(1); } echo "PHP " . PHP_VERSION . PHP_EOL;'

      - name: Run PHP 8.5 compatibility suite
        run: bash scripts/php85-compatibility.sh
