name: BRVTAL 1875 synthetic visual evidence

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'tests/e2e/issue-1875-visual-evidence.spec.mjs'
      - '.github/workflows/issue-1875-visual-evidence.yml'

permissions:
  contents: read

jobs:
  captures:
    if: github.repository == 'pl0n3r/brvtal' && github.event.pull_request.number == 1896
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node test dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium with dependencies
        run: npx playwright install --with-deps chromium
      - name: Capture real browser on synthetic fixtures
        run: npx playwright test tests/e2e/issue-1875-visual-evidence.spec.mjs --project=chromium --reporter=list
      - name: Publish four exact-SHA visual captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-1875-visual-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/issue-1875-visual/*
          if-no-files-found: error
          retention-days: 14
