name: Production Deploy Observer
run-name: Production Deploy Observer #${{ github.run_number }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  observe:
    name: release-deploy-marker
    uses: pl0n3r/factory/.github/workflows/observar.yml@v1
    with:
      domain: https://www.brvtal.com.co
      health_path: /api/health.php
      paths: '["/"]'
      version_source: config/version.php
      version_format: php-const
      version_key: BRVTAL_APP_VERSION
      expected_sha: ${{ github.sha }}
      require_schema: true
      label_language: en
