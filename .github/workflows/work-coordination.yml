name: Work Coordination

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled, closed, reopened]
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: >-
    work-coordination-${{
      github.event.issue.number && format('work/issue-{0}', github.event.issue.number)
      || github.event.pull_request.head.ref
      || github.run_id
    }}
  cancel-in-progress: false

jobs:
  command:
    name: Process coordination command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login != 'github-actions[bot]' &&
      (github.event.comment.body == '/take' ||
       github.event.comment.body == '/force-release' ||
       startsWith(github.event.comment.body, '/release ') ||
       startsWith(github.event.comment.body, '/transfer ') ||
       startsWith(github.event.comment.body, '/recover '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout canonical coordinator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Execute coordination command
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 scripts/work_coordinator.py comment --repo "$REPOSITORY" --issue "$ISSUE" --actor "$ACTOR" --association "$ASSOCIATION" --body "$BODY"

  label-reservation:
    name: Synchronize label reservation
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login != 'github-actions[bot]' &&
      github.event.label.name == 'status: reserved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout canonical coordinator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Process requested state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          python3 scripts/work_coordinator.py label-event --repo "$REPOSITORY" --issue "$ISSUE" --actor "$ACTOR" --label "$LABEL"

  pull-request-state:
    name: Synchronize Pull Request state
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout canonical coordinator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Synchronize state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/work_coordinator.py ]]; then
            echo "Bootstrap: coordinator is not on default main yet; PR state sync is deferred until v0.1.22 lands."
            exit 0
          fi
          python3 scripts/work_coordinator.py pr-event --repo "$REPOSITORY" --pr "$PR" --action "$ACTION"

  issue-state:
    name: Synchronize Issue state
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'closed' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout canonical coordinator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Synchronize state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          python3 scripts/work_coordinator.py issue-event --repo "$REPOSITORY" --issue "$ISSUE" --action "$ACTION"
