name: Work Coordination

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled, closed, reopened]
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-work-coordination
  cancel-in-progress: false
  queue: max

jobs:
  command:
    name: Process coordination command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login != 'github-actions[bot]' &&
      (github.event.comment.body == '/take' ||
       github.event.comment.body == '/force-release' ||
       startsWith(github.event.comment.body, '/release ') ||
       startsWith(github.event.comment.body, '/transfer ') ||
       startsWith(github.event.comment.body, '/recover ') ||
       startsWith(github.event.comment.body, '/renovar-contrato '))
    # Factory v1 declares this maximum workflow_call envelope. GitHub validates
    # the caller against that envelope before selecting the operation-specific job;
    # the reusable narrows effective permissions internally per operation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    # Factory Kit consumers intentionally follow the protected major channel @v1;
    # promotion of that channel is governed by Factory's exact-SHA release gate.
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: comment
      profile: en
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      association: ${{ github.event.comment.author_association }}
      body: ${{ github.event.comment.body }}

  label-reservation:
    name: Synchronize label reservation
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login != 'github-actions[bot]' &&
      github.event.label.name == 'status: reserved'
    # Factory v1 declares this maximum workflow_call envelope. GitHub validates
    # the caller against that envelope before selecting the operation-specific job;
    # the reusable narrows effective permissions internally per operation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    # Factory Kit consumers intentionally follow the protected major channel @v1;
    # promotion of that channel is governed by Factory's exact-SHA release gate.
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: label
      profile: en
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      label: ${{ github.event.label.name }}

  pull-request-state:
    name: Synchronize Pull Request state
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Factory v1 declares this maximum workflow_call envelope. GitHub validates
    # the caller against that envelope before selecting the operation-specific job;
    # the reusable narrows effective permissions internally per operation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    # Factory Kit consumers intentionally follow the protected major channel @v1;
    # promotion of that channel is governed by Factory's exact-SHA release gate.
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: pr
      profile: en
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action }}

  issue-state:
    name: Synchronize Issue state
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'closed' || github.event.action == 'reopened')
    # Factory v1 declares this maximum workflow_call envelope. GitHub validates
    # the caller against that envelope before selecting the operation-specific job;
    # the reusable narrows effective permissions internally per operation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    # Factory Kit consumers intentionally follow the protected major channel @v1;
    # promotion of that channel is governed by Factory's exact-SHA release gate.
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: issue
      profile: en
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}

  sweep:
    name: Mark recoverable reservations
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Factory v1 declares this maximum workflow_call envelope. GitHub validates
    # the caller against that envelope before selecting the operation-specific job;
    # the reusable narrows effective permissions internally per operation.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    # Factory Kit consumers intentionally follow the protected major channel @v1;
    # promotion of that channel is governed by Factory's exact-SHA release gate.
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: sweep
      profile: en
