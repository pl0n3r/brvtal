name: BRVTAL CI
run-name: BRVTAL CI #${{ github.run_number }} · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish build context
        shell: bash
        env:
          BRVTAL_EVENT: ${{ github.event_name }}
          BRVTAL_REF: ${{ github.ref_name }}
          BRVTAL_SHA: ${{ github.sha }}
          BRVTAL_ACTOR: ${{ github.actor }}
          BRVTAL_RUN_NUMBER: ${{ github.run_number }}
          BRVTAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          BRVTAL_BASE_REF: ${{ github.base_ref }}
          BRVTAL_HEAD_REF: ${{ github.head_ref }}
          BRVTAL_BEFORE: ${{ github.event.before }}
          BRVTAL_PR_NUMBER: ${{ github.event.pull_request.number }}
          BRVTAL_PR_TITLE: ${{ github.event.pull_request.title }}
          BRVTAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRVTAL_SERVER_URL: ${{ github.server_url }}
          BRVTAL_REPOSITORY: ${{ github.repository }}
          BRVTAL_RUN_ID: ${{ github.run_id }}
        run: |
          set +e

          source_sha="$BRVTAL_SHA"
          if [[ "$BRVTAL_EVENT" == "pull_request" && -n "$BRVTAL_PR_HEAD_SHA" ]]; then
            source_sha="$BRVTAL_PR_HEAD_SHA"
          fi
          short_sha="${source_sha:0:7}"

          commit_subject=$(git log -1 --pretty=%s "$source_sha" 2>/dev/null || git log -1 --pretty=%s HEAD 2>/dev/null || echo "unknown")
          commit_time=$(git log -1 --pretty=%cI "$source_sha" 2>/dev/null || git log -1 --pretty=%cI HEAD 2>/dev/null || echo "unknown")
          safe_subject="${commit_subject//$'\n'/ }"
          safe_subject="${safe_subject//|/\\|}"

          changed_file_list=""
          if [[ "$BRVTAL_EVENT" == "pull_request" && -n "$BRVTAL_BASE_REF" ]]; then
            base_sha=$(git merge-base "origin/$BRVTAL_BASE_REF" HEAD 2>/dev/null || true)
            if [[ -n "$base_sha" ]]; then
              changed_file_list=$(git diff --name-only "$base_sha" HEAD 2>/dev/null || true)
            fi
          elif [[ "$BRVTAL_BEFORE" =~ ^[0-9a-fA-F]{40}$ && ! "$BRVTAL_BEFORE" =~ ^0+$ ]]; then
            changed_file_list=$(git diff --name-only "$BRVTAL_BEFORE" "$BRVTAL_SHA" 2>/dev/null || true)
          fi
          if [[ -z "$changed_file_list" ]]; then
            changed_file_list=$(git show --pretty='' --name-only HEAD 2>/dev/null || true)
          fi
          changed_file_list=$(printf '%s\n' "$changed_file_list" | sed '/^[[:space:]]*$/d' | sort -u)
          changed_count=$(printf '%s\n' "$changed_file_list" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')

          areas=""
          add_area() {
            local area="$1"
            case ",$areas," in
              *",$area,"*) ;;
              *) areas="${areas:+$areas, }$area" ;;
            esac
          }
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              discadmin/*) add_area "DISCADMIN" ;;
              api/*) add_area "API" ;;
              database/*) add_area "Database/migrations" ;;
              tests/*|playwright.config.mjs|package.json|package-lock.json) add_area "Tests/tooling" ;;
              docs/*|README.md|AGENTS.md) add_area "Docs/operations" ;;
              .github/*) add_area "CI/CD" ;;
              config/*) add_area "Runtime config" ;;
              assets/*|uploads/*) add_area "Media/assets" ;;
              css/*|js/*|index.php|index.html) add_area "Public web" ;;
              *) add_area "Other" ;;
            esac
          done <<< "$changed_file_list"
          [[ -z "$areas" ]] && areas="None detected"

          pr_context="—"
          if [[ -n "$BRVTAL_PR_NUMBER" ]]; then
            clean_pr_title="${BRVTAL_PR_TITLE//$'\n'/ }"
            clean_pr_title="${clean_pr_title//|/\\|}"
            pr_context="#$BRVTAL_PR_NUMBER — $clean_pr_title"
          fi

          deploy_eligibility="NO — validation only"
          if [[ "$BRVTAL_EVENT" == "push" && "$BRVTAL_REF" == "main" ]]; then
            deploy_eligibility="YES — push to main / Hostinger auto-deploy candidate"
          fi

          {
            echo "# BRVTAL CI / Deploy Candidate"
            echo
            echo "> Runtime build context. A deploy-eligible run does not by itself prove that Hostinger completed deployment or that production smoke was performed."
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run | [#$BRVTAL_RUN_NUMBER]($BRVTAL_SERVER_URL/$BRVTAL_REPOSITORY/actions/runs/$BRVTAL_RUN_ID) · attempt $BRVTAL_RUN_ATTEMPT |"
            echo "| Event | \`$BRVTAL_EVENT\` |"
            echo "| Ref | \`$BRVTAL_REF\` |"
            echo "| Head / base | \`${BRVTAL_HEAD_REF:-—}\` → \`${BRVTAL_BASE_REF:-—}\` |"
            echo "| PR | $pr_context |"
            echo "| Source SHA | \`$source_sha\` (\`$short_sha\`) |"
            echo "| Checkout SHA | \`$BRVTAL_SHA\` |"
            echo "| Commit | $safe_subject |"
            echo "| Commit time | \`$commit_time\` |"
            echo "| Actor | \`$BRVTAL_ACTOR\` |"
            echo "| Deploy eligibility | **$deploy_eligibility** |"
            echo "| Changed files | **$changed_count** |"
            echo "| Change surface | $areas |"
            echo
            echo "## Changed files"
            if [[ -n "$changed_file_list" ]]; then
              echo "<details><summary>Show file list</summary>"
              echo
              while IFS= read -r file; do
                [[ -n "$file" ]] && printf -- '- `%s`\n' "$file"
              done <<< "$changed_file_list"
              echo
              echo "</details>"
            else
              echo "No changed files detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install PHP database extension
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql mariadb-client

      - name: Validate PHP syntax
        run: |
          find config discadmin api tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: |
          find discadmin js tests/e2e \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Run API contract tests
        run: php tests/api-contract.php

      - name: Run Media Library contract tests
        run: php tests/media-library-contract.php

      - name: Run Releases contract tests
        run: php tests/releases-contract.php

      - name: Run Blog contract tests
        run: php tests/blog-contract.php

      - name: Run Content Health contract tests
        run: php tests/content-health-contract.php

      - name: Run SEO metadata contract tests
        run: php tests/seo-contract.php

      - name: Run Global Search contract tests
        run: php tests/global-search-contract.php

      - name: Run Bulk Actions contract tests
        run: php tests/bulk-actions-contract.php

      - name: Run Public Archive contract tests
        run: php tests/public-archive-contract.php

      - name: Run Public Entity contract tests
        run: php tests/public-entity-contract.php

      - name: Run Related Content contract tests
        run: php tests/related-content-contract.php

      - name: Run Admin Activity contract tests
        run: php tests/admin-activity-contract.php

      - name: Run Backups contract tests
        run: php tests/backups-contract.php

      - name: Run Project Operations contract tests
        run: php tests/project-operations-contract.php

      - name: Validate Blog migration is idempotent
        run: |
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_blog_01.sql
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_blog_01.sql
          count=$(mariadb -N -B -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='brvtal_test_ci' AND TABLE_NAME IN ('blog_posts','blog_tags','blog_post_tags','blog_post_relations');")
          test "$count" = "4"

      - name: Run MariaDB integration tests
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: npm run test:integration

      - name: Run Global Search MariaDB integration
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: php tests/integration/global-search.php

      - name: Run Bulk Actions MariaDB integration
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: php tests/integration/bulk-actions.php

      - name: Run Public Archive MariaDB integration
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: php tests/integration/public-archive.php

      - name: Run Related Content MariaDB integration
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: php tests/integration/related-content.php

      - name: Validate Admin Activity migration is idempotent
        run: |
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "CREATE TABLE IF NOT EXISTS admins (id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY, email VARCHAR(190) NOT NULL UNIQUE, password_hash VARCHAR(255) NOT NULL, name VARCHAR(120) NOT NULL DEFAULT 'BRVTAL Admin', is_active TINYINT(1) NOT NULL DEFAULT 1, last_login_at DATETIME NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_admin_activity_01.sql
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_admin_activity_01.sql
          count=$(mariadb -N -B -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='brvtal_test_ci' AND TABLE_NAME='admin_activity_log';")
          test "$count" = "1"

      - name: Run Admin Activity MariaDB integration
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: php tests/integration/admin-activity.php

      - name: Run Backups MariaDB integration
        env:
          BRVTAL_INTEGRATION_TESTS: '1'
          BRVTAL_TEST_DB_HOST: 127.0.0.1
          BRVTAL_TEST_DB_PORT: '3306'
          BRVTAL_TEST_DB_NAME: brvtal_test_ci
          BRVTAL_TEST_DB_USER: root
          BRVTAL_TEST_DB_PASS: brvtal_root
        run: php tests/integration/backups.php

      - name: Validate SEO migration is idempotent
        run: |
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "CREATE TABLE IF NOT EXISTS events (id INT PRIMARY KEY, description TEXT); CREATE TABLE IF NOT EXISTS artists (id INT PRIMARY KEY, bio TEXT); CREATE TABLE IF NOT EXISTS sets_media (id INT PRIMARY KEY, description TEXT); CREATE TABLE IF NOT EXISTS releases (id INT PRIMARY KEY, description TEXT);"
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_seo_01.sql
          mariadb -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_seo_01.sql
          count=$(mariadb -N -B -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='brvtal_test_ci' AND TABLE_NAME IN ('events','artists','sets_media','releases') AND COLUMN_NAME IN ('seo_title','seo_description');")
          test "$count" = "8"

      - name: Install Node test dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Publish validation result
        if: always()
        shell: bash
        env:
          BRVTAL_JOB_STATUS: ${{ job.status }}
          BRVTAL_EVENT: ${{ github.event_name }}
          BRVTAL_REF: ${{ github.ref_name }}
          BRVTAL_SHA: ${{ github.sha }}
        run: |
          set +e
          php_version=$(php -r 'echo PHP_VERSION;' 2>/dev/null || echo 'unavailable')
          node_version=$(node --version 2>/dev/null || echo 'unavailable')
          mariadb_version=$(mariadb --version 2>/dev/null | head -1 || echo 'unavailable')
          deploy_note="Validation only."
          if [[ "$BRVTAL_EVENT" == "push" && "$BRVTAL_REF" == "main" ]]; then
            deploy_note="Source is eligible for Hostinger auto-deploy from main."
          fi
          status_upper=$(printf '%s' "$BRVTAL_JOB_STATUS" | tr '[:lower:]' '[:upper:]')
          {
            echo
            echo "## Validation result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| CI job | **$status_upper** |"
            echo "| PHP | \`$php_version\` |"
            echo "| Node | \`$node_version\` |"
            echo "| MariaDB client | \`$mariadb_version\` |"
            echo "| Deploy note | $deploy_note |"
            echo
            echo "> CI success validates source and automated tests. It does **not** prove Hostinger deployment completion or production behavior."
          } >> "$GITHUB_STEP_SUMMARY"
