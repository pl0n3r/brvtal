name: BRVTAL CI
run-name: BRVTAL CI #${{ github.run_number }} · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    outputs:
      run_db: ${{ steps.scope.outputs.run_db }}
      run_browser: ${{ steps.scope.outputs.run_browser }}
      run_realstack: ${{ steps.scope.outputs.run_realstack }}
      run_webkit: ${{ steps.scope.outputs.run_webkit }}
      run_recovery: ${{ steps.scope.outputs.run_recovery }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect validation scope and publish build context
        id: scope
        shell: bash
        env:
          BRVTAL_EVENT: ${{ github.event_name }}
          BRVTAL_REF: ${{ github.ref_name }}
          BRVTAL_SHA: ${{ github.sha }}
          BRVTAL_ACTOR: ${{ github.actor }}
          BRVTAL_RUN_NUMBER: ${{ github.run_number }}
          BRVTAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          BRVTAL_BASE_REF: ${{ github.base_ref }}
          BRVTAL_HEAD_REF: ${{ github.head_ref }}
          BRVTAL_BEFORE: ${{ github.event.before }}
          BRVTAL_PR_NUMBER: ${{ github.event.pull_request.number }}
          BRVTAL_PR_TITLE: ${{ github.event.pull_request.title }}
          BRVTAL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRVTAL_SERVER_URL: ${{ github.server_url }}
          BRVTAL_REPOSITORY: ${{ github.repository }}
          BRVTAL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          source_sha="$BRVTAL_SHA"
          if [[ "$BRVTAL_EVENT" == "pull_request" && -n "$BRVTAL_PR_HEAD_SHA" ]]; then
            source_sha="$BRVTAL_PR_HEAD_SHA"
          fi
          short_sha="${source_sha:0:7}"

          changed_file_list=""
          if [[ "$BRVTAL_EVENT" == "pull_request" && -n "$BRVTAL_BASE_REF" ]]; then
            base_sha=$(git merge-base "origin/$BRVTAL_BASE_REF" HEAD 2>/dev/null || true)
            if [[ -n "$base_sha" ]]; then
              changed_file_list=$(git diff --name-only "$base_sha" HEAD 2>/dev/null || true)
            fi
          elif [[ "$BRVTAL_BEFORE" =~ ^[0-9a-fA-F]{40}$ && ! "$BRVTAL_BEFORE" =~ ^0+$ ]]; then
            changed_file_list=$(git diff --name-only "$BRVTAL_BEFORE" "$BRVTAL_SHA" 2>/dev/null || true)
          fi
          if [[ -z "$changed_file_list" ]]; then
            changed_file_list=$(git show --pretty='' --name-only HEAD 2>/dev/null || true)
          fi
          changed_file_list=$(printf '%s\n' "$changed_file_list" | sed '/^[[:space:]]*$/d' | sort -u)
          changed_count=$(printf '%s\n' "$changed_file_list" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')

          full=false
          run_db=false
          run_browser=false
          run_realstack=false
          run_webkit=false
          run_recovery=false
          if [[ "$BRVTAL_EVENT" == "workflow_dispatch" ]]; then
            full=true
            run_db=true
            run_browser=true
            run_realstack=true
            run_webkit=true
            run_recovery=true
          fi

          areas=""
          add_area() {
            local area="$1"
            case ",$areas," in
              *",$area,"*) ;;
              *) areas="${areas:+$areas, }$area" ;;
            esac
          }

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              discadmin/*.js|discadmin/*.css)
                add_area "DISCADMIN UI"; run_browser=true ;;
              discadmin/*.php)
                add_area "DISCADMIN PHP"; run_browser=true; run_realstack=true ;;
              discadmin/*)
                add_area "DISCADMIN"; run_browser=true ;;
              api/*)
                add_area "API"; run_db=true; run_realstack=true ;;
              database/*)
                add_area "Database/migrations"; run_db=true; run_realstack=true ;;
              config/*)
                add_area "Runtime config"; run_db=true; run_realstack=true ;;
              js/*|css/*|index.php|index.html|sitemap.php|assets/*|uploads/*)
                add_area "Public web"; run_browser=true ;;
              tests/integration/backup-recovery-rehearsal.php)
                add_area "Recovery testing"; run_db=true; run_recovery=true ;;
              tests/integration/*)
                add_area "Integration tests"; run_db=true ;;
              tests/e2e/content-core-real-stack.spec.mjs|tests/e2e/run-content-core-real-stack.sh)
                add_area "Real-stack tests"; run_realstack=true ;;
              tests/e2e/discadmin-totp-login.spec.mjs)
                add_area "Auth browser tests"; run_browser=true; run_webkit=true ;;
              tests/e2e/*)
                add_area "Browser tests"; run_browser=true ;;
              playwright.config.mjs|package.json|package-lock.json)
                add_area "Test tooling"; run_browser=true; run_realstack=true; run_webkit=true ;;
              .github/workflows/update-release-metadata.yml)
                add_area "CI/CD core"; run_db=true; run_browser=true; run_realstack=true; run_webkit=true; run_recovery=true ;;
              .github/*)
                add_area "CI/CD" ;;
              scripts/*|tests/*.php)
                add_area "Fast tests/tooling" ;;
              docs/*|README.md|AGENTS.md)
                add_area "Docs/operations" ;;
              *)
                add_area "Other"; run_db=true; run_browser=true; run_realstack=true ;;
            esac

            case "$file" in
              config/backups.php|discadmin/backups.php|tests/backups-contract.php|tests/backup-recovery-rehearsal-contract.php)
                run_db=true; run_recovery=true ;;
            esac

            case "$file" in
              config/admin_auth.php|config/totp*.php|discadmin/totp*|discadmin/index.php|api/index.php)
                run_webkit=true ;;
            esac
          done <<< "$changed_file_list"
          [[ -z "$areas" ]] && areas="None detected"

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "run_db=$run_db" >> "$GITHUB_OUTPUT"
          echo "run_browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "run_realstack=$run_realstack" >> "$GITHUB_OUTPUT"
          echo "run_webkit=$run_webkit" >> "$GITHUB_OUTPUT"
          echo "run_recovery=$run_recovery" >> "$GITHUB_OUTPUT"

          commit_subject=$(git log -1 --pretty=%s "$source_sha" 2>/dev/null || git log -1 --pretty=%s HEAD 2>/dev/null || echo "unknown")
          commit_time=$(git log -1 --pretty=%cI "$source_sha" 2>/dev/null || git log -1 --pretty=%cI HEAD 2>/dev/null || echo "unknown")
          safe_subject="${commit_subject//$'\n'/ }"
          safe_subject="${safe_subject//|/\\|}"
          pr_context="—"
          if [[ -n "$BRVTAL_PR_NUMBER" ]]; then
            clean_pr_title="${BRVTAL_PR_TITLE//$'\n'/ }"
            clean_pr_title="${clean_pr_title//|/\\|}"
            pr_context="#$BRVTAL_PR_NUMBER — $clean_pr_title"
          fi
          deploy_eligibility="NO — validation only"
          if [[ "$BRVTAL_EVENT" == "push" && "$BRVTAL_REF" == "main" ]]; then
            deploy_eligibility="YES — push to main / Hostinger auto-deploy candidate"
          fi

          {
            echo "# BRVTAL CI / Deploy Candidate"
            echo
            echo "> Runtime build context. A deploy-eligible run does not by itself prove Hostinger deployment completion or production behavior."
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run | [#$BRVTAL_RUN_NUMBER]($BRVTAL_SERVER_URL/$BRVTAL_REPOSITORY/actions/runs/$BRVTAL_RUN_ID) · attempt $BRVTAL_RUN_ATTEMPT |"
            echo "| Event | \`$BRVTAL_EVENT\` |"
            echo "| Ref | \`$BRVTAL_REF\` |"
            echo "| Head / base | \`${BRVTAL_HEAD_REF:-—}\` → \`${BRVTAL_BASE_REF:-—}\` |"
            echo "| PR | $pr_context |"
            echo "| Source SHA | \`$source_sha\` (\`$short_sha\`) |"
            echo "| Checkout SHA | \`$BRVTAL_SHA\` |"
            echo "| Commit | $safe_subject |"
            echo "| Commit time | \`$commit_time\` |"
            echo "| Actor | \`$BRVTAL_ACTOR\` |"
            echo "| Deploy eligibility | **$deploy_eligibility** |"
            echo "| Changed files | **$changed_count** |"
            echo "| Change surface | $areas |"
            echo "| Validation scope | fast=YES · db=$run_db · chromium=$run_browser · real-stack=$run_realstack · webkit=$run_webkit · recovery=$run_recovery · full=$full |"
            echo
            echo "## Changed files"
            if [[ -n "$changed_file_list" ]]; then
              echo "<details><summary>Show file list</summary>"
              echo
              while IFS= read -r file; do
                [[ -n "$file" ]] && printf -- '- `%s`\n' "$file"
              done <<< "$changed_file_list"
              echo
              echo "</details>"
            else
              echo "No changed files detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          ini-file: production

      - name: Run PHP 8.5 compatibility and contract suite
        run: bash scripts/php85-compatibility.sh

      - name: Validate JavaScript syntax
        run: find discadmin js tests/e2e \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Verify README matches this deploy exactly
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          changed = sorted(
              line.strip()
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only', base, head],
                  text=True,
              ).splitlines()
              if line.strip()
          )

          readme = Path('README.md').read_text(encoding='utf-8')
          required = [
              '# BRVTAL — Último deploy',
              '## Qué se hizo',
              '## Archivos modificados en este deploy',
              '## Validación',
              '## Qué sigue',
          ]
          missing_headings = [heading for heading in required if heading not in readme]
          if missing_headings:
              print('README missing required deploy-snapshot headings:', file=sys.stderr)
              for heading in missing_headings:
                  print(f'  - {heading}', file=sys.stderr)
              sys.exit(1)

          section = re.search(
              r'## Archivos modificados en este deploy\s*\n(.*?)(?=\n## |\Z)',
              readme,
              flags=re.S,
          )
          if not section:
              print('README changed-files section could not be parsed.', file=sys.stderr)
              sys.exit(1)

          listed = sorted(re.findall(r'^- `([^`]+)`(?:\s+—.*)?$', section.group(1), flags=re.M))
          if changed != listed:
              print('README deploy file list does not match the PR diff.', file=sys.stderr)
              print('\nChanged in PR:', file=sys.stderr)
              for path in changed:
                  print(f'  {path}', file=sys.stderr)
              print('\nListed in README:', file=sys.stderr)
              for path in listed:
                  print(f'  {path}', file=sys.stderr)
              print('\nRefresh README.md before merge.', file=sys.stderr)
              sys.exit(1)

          if len(readme.encode('utf-8')) >= 8000:
              print('README is too large for a deploy snapshot (must stay under 8 KB).', file=sys.stderr)
              sys.exit(1)

          print(f'README deploy snapshot matches {len(changed)} changed files.')
          PY

  database:
    name: database
    needs: fast
    if: needs.fast.outputs.run_db == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_ci
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.5 with database extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          ini-file: production

      - name: Validate Blog migration is idempotent
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_blog_01.sql
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_blog_01.sql
          count=$(mysql -N -B -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='brvtal_test_ci' AND TABLE_NAME IN ('blog_posts','blog_tags','blog_post_tags','blog_post_relations');")
          test "$count" = "4"

      - name: Run MariaDB integrations
        run: |
          npm run test:integration
          php tests/integration/global-search.php
          php tests/integration/bulk-actions.php
          php tests/integration/public-archive.php
          php tests/integration/related-content.php

      - name: Validate Admin Activity migration and integration
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "CREATE TABLE IF NOT EXISTS admins (id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY, email VARCHAR(190) NOT NULL UNIQUE, password_hash VARCHAR(255) NOT NULL, name VARCHAR(120) NOT NULL DEFAULT 'BRVTAL Admin', is_active TINYINT(1) NOT NULL DEFAULT 1, last_login_at DATETIME NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_admin_activity_01.sql
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_admin_activity_01.sql
          count=$(mysql -N -B -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='brvtal_test_ci' AND TABLE_NAME='admin_activity_log';")
          test "$count" = "1"
          php tests/integration/admin-activity.php

      - name: Run Backups MariaDB integration
        run: php tests/integration/backups.php

      - name: Validate SEO migration is idempotent
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "CREATE TABLE IF NOT EXISTS events (id INT PRIMARY KEY, description TEXT); CREATE TABLE IF NOT EXISTS artists (id INT PRIMARY KEY, bio TEXT); CREATE TABLE IF NOT EXISTS sets_media (id INT PRIMARY KEY, description TEXT); CREATE TABLE IF NOT EXISTS releases (id INT PRIMARY KEY, description TEXT);"
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_seo_01.sql
          mysql -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci < database/migration_seo_01.sql
          count=$(mysql -N -B -h127.0.0.1 -P3306 -uroot -pbrvtal_root brvtal_test_ci -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='brvtal_test_ci' AND TABLE_NAME IN ('events','artists','sets_media','releases') AND COLUMN_NAME IN ('seo_title','seo_description');")
          test "$count" = "8"

  browser:
    name: chromium
    needs: fast
    if: needs.fast.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node test dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Chromium browser tests
        run: npx playwright test --project=chromium

  realstack:
    name: real-stack
    needs: fast
    if: needs.fast.outputs.run_realstack == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_ci
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
      BRVTAL_REAL_STACK_FORCE: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.5 with database extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          ini-file: production

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node test dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run authenticated PHP/MariaDB browser smoke
        run: bash tests/e2e/run-content-core-real-stack.sh

  webkit:
    name: webkit-totp
    needs: fast
    if: needs.fast.outputs.run_webkit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node test dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Cache WebKit
        id: webkit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('package.json') }}

      - name: Install WebKit system dependencies
        run: npx playwright install-deps webkit

      - name: Install WebKit browser
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit

      - name: Run targeted WebKit TOTP regression
        run: npx playwright test tests/e2e/discadmin-totp-login.spec.mjs --project=webkit-totp

  recovery:
    name: recovery-rehearsal
    needs: fast
    if: needs.fast.outputs.run_recovery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_backup_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_BACKUP_RECOVERY_REHEARSAL: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_backup_source
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
      BRVTAL_BACKUP_RECOVERY_OUTPUT: artifacts/backup-recovery-rehearsal.json
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.5 with recovery extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip
          coverage: none
          ini-file: production

      - name: Run isolated backup recovery rehearsal
        run: php tests/integration/backup-recovery-rehearsal.php

      - name: Publish rehearsal summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backup recovery rehearsal"
            echo
            echo "- Source: disposable MariaDB database \`brvtal_test_backup_source\`"
            echo "- Recovery: unique \`brvtal_test_recovery_*\` database created and dropped inside this job"
            echo "- Scope: database dump + foreign keys + view + media ZIP snapshot"
            echo "- Production restore: **DISABLED / NOT TOUCHED**"
            echo "- Evidence: \`backup-recovery-rehearsal.json\` artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-recovery-rehearsal-${{ github.run_id }}
          path: artifacts/backup-recovery-rehearsal.json
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs: [fast, database, browser, realstack, webkit, recovery]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation gates
        shell: bash
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          DB_RESULT: ${{ needs.database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          REALSTACK_RESULT: ${{ needs.realstack.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
          RUN_DB: ${{ needs.fast.outputs.run_db }}
          RUN_BROWSER: ${{ needs.fast.outputs.run_browser }}
          RUN_REALSTACK: ${{ needs.fast.outputs.run_realstack }}
          RUN_WEBKIT: ${{ needs.fast.outputs.run_webkit }}
          RUN_RECOVERY: ${{ needs.fast.outputs.run_recovery }}
        run: |
          set -euo pipefail
          failures=0

          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Required gate $name ended as $result" >&2
              failures=1
            fi
          }
          require_optional() {
            local name="$1" expected="$2" result="$3"
            if [[ "$expected" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "Skipped gate $name ended unexpectedly as $result" >&2
              failures=1
            fi
          }

          require_success fast "$FAST_RESULT"
          require_optional database "$RUN_DB" "$DB_RESULT"
          require_optional chromium "$RUN_BROWSER" "$BROWSER_RESULT"
          require_optional real-stack "$RUN_REALSTACK" "$REALSTACK_RESULT"
          require_optional webkit "$RUN_WEBKIT" "$WEBKIT_RESULT"
          require_optional recovery "$RUN_RECOVERY" "$RECOVERY_RESULT"

          exit "$failures"

      - name: Publish validation result
        if: always()
        shell: bash
        env:
          BRVTAL_EVENT: ${{ github.event_name }}
          BRVTAL_REF: ${{ github.ref_name }}
          FAST_RESULT: ${{ needs.fast.result }}
          DB_RESULT: ${{ needs.database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          REALSTACK_RESULT: ${{ needs.realstack.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: |
          set +e
          deploy_note="Validation only."
          if [[ "$BRVTAL_EVENT" == "push" && "$BRVTAL_REF" == "main" ]]; then
            deploy_note="Source is eligible for Hostinger auto-deploy from main."
          fi
          {
            echo "# BRVTAL validation result"
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Fast PHP 8.5 + contracts | **$FAST_RESULT** |"
            echo "| MariaDB | **$DB_RESULT** |"
            echo "| Chromium | **$BROWSER_RESULT** |"
            echo "| Real-stack smoke | **$REALSTACK_RESULT** |"
            echo "| WebKit TOTP | **$WEBKIT_RESULT** |"
            echo "| Backup recovery | **$RECOVERY_RESULT** |"
            echo "| Deploy note | $deploy_note |"
            echo
            echo "> Pull requests and exact \`main\` pushes use the same diff-aware gates; manual dispatch runs the full matrix. CI success does **not** prove Hostinger deployment completion or production behavior."
          } >> "$GITHUB_STEP_SUMMARY"
