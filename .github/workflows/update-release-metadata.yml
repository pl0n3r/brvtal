name: Update release metadata
on:
  push:
    branches: [main]
    paths-ignore: ['config/version.php']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-metadata-main
  cancel-in-progress: false
jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate PHP and JavaScript
        run: |
          find config discadmin api tests -name '*.php' -print0 | xargs -0 -n1 php -l
          find discadmin -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run API contract tests
        run: php tests/api-contract.php
      - name: Run Media Library contract tests
        run: php tests/media-library-contract.php
      - name: Update build metadata
        run: python3 scripts/update-release-metadata.py
      - name: Validate version metadata
        run: php -l config/version.php
      - name: Commit metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- config/version.php; then exit 0; fi
          git config user.name 'BRVTAL Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/version.php
          git commit -m 'chore: update release metadata [skip ci]'
          git push origin HEAD:main
