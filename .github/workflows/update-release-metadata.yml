name: BRVTAL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP syntax
        run: |
          find config discadmin api tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: |
          find discadmin tests/e2e -name '*.js' -o -name '*.mjs' | xargs -r -n1 node --check

      - name: Run API contract tests
        run: php tests/api-contract.php

      - name: Run Media Library contract tests
        run: php tests/media-library-contract.php

      - name: Install Node test dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run DISCADMIN browser tests
        run: npm run test:e2e
