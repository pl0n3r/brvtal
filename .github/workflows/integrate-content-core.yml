name: Integrate Content Core

on:
  push:
    branches: [feat/1-content-core]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1-content-core
          fetch-depth: 0
      - name: Patch API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/index.php'); s=p.read_text()
          replacements={
          "'events'=>['title','slug','event_date','venue','city','description','skin','accent','cover_image','ticket_url','status','sort_order']":"'events'=>['title','slug','event_date','venue','city','description','skin','accent','cover_image','ticket_url','ticket_instructions','ticket_qr','featured','published_at','cancelled_at','finished_at','archive_year','status','sort_order']",
          "'artists'=>['name','slug','bio','photo','instagram_url','soundcloud_url','website_url','status','sort_order']":"'artists'=>['name','slug','bio','photo','instagram_url','soundcloud_url','website_url','collective_status','collective_order','collective_joined_at','collective_left_at','status','sort_order']",
          "'pages'=>'pages','settings'=>'settings'":"'pages'=>'pages','ticket_types'=>'event_ticket_types','settings'=>'settings'",
          "['draft','published','archived']":"['draft','published','upcoming','tickets_available','last_tickets','sold_out','cancelled','finished','archived']",
          "SELECT id,title,slug,event_date,venue,city,description,skin,accent,cover_image,ticket_url FROM events":"SELECT id,title,slug,event_date,archive_year,venue,city,description,skin,accent,cover_image,ticket_url,ticket_instructions,ticket_qr,featured,published_at,cancelled_at,finished_at,status FROM events",
          "SELECT id,name,slug,bio,photo,instagram_url,soundcloud_url,website_url FROM artists":"SELECT id,name,slug,bio,photo,instagram_url,soundcloud_url,website_url,collective_status,collective_order,collective_joined_at,collective_left_at FROM artists",
          "        $pages=$pdo->query(\"SELECT id,title,slug,locale,content_json,seo_title,seo_description FROM pages WHERE status='published' ORDER BY id DESC\")->fetchAll();":"        $pages=$pdo->query(\"SELECT id,title,slug,locale,content_json,seo_title,seo_description FROM pages WHERE status='published' ORDER BY id DESC\")->fetchAll();\n        $ticketTypes=$pdo->query(\"SELECT id,event_id,name,description,price,currency,external_url,payment_instructions,qr_image,status,available_from,available_until,sort_order FROM event_ticket_types WHERE status IN ('active','sold_out') ORDER BY event_id,sort_order,name\")->fetchAll();\n        $ticketsByEvent=[]; foreach($ticketTypes as $ticket){$ticketsByEvent[$ticket['event_id']][]=$ticket;}\n        foreach($events as &$event){$event['ticket_types']=$ticketsByEvent[$event['id']]??[];} unset($event);",
          "'settings'=>$settings,'generated_at'=>date(DATE_ATOM)]":"'settings'=>$settings,'generated_at'=>date(DATE_ATOM)]",
          }
          for old,new in replacements.items():
              if old not in s and old != "'settings'=>$settings,'generated_at'=>date(DATE_ATOM)]":
                  raise SystemExit('Expected API pattern missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -e
          php -l api/index.php
          php -l database/migration_content_core_01.sql || true
      - name: Commit
        run: |
          git config user.name 'BRVTAL Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.php
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: expose content core lifecycle and tickets in API'
          git push origin feat/1-content-core
