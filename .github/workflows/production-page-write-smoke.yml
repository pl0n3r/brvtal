name: Controlled Production Page Write Smoke
run-name: Controlled Production Page Write Smoke #${{ github.run_number }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type WRITE_AND_DELETE_TEMP_PAGE to create, verify, and delete one temporary published CMS Page.'
        required: true
        type: string
  workflow_run:
    workflows: ["Production Deploy Observer"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: brvtal-production-page-write-smoke
  cancel-in-progress: false

jobs:
  backup:
    name: exact-target-production-backup
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm == 'WRITE_AND_DELETE_TEMP_PAGE') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       vars.BRVTAL_APP_PHASE == 'construction')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRVTAL_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out exact observed source for backup
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Create exact-target production backup
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BRVTAL_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid exact target SHA"; exit 1; }
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$BRVTAL_EXPECTED_SHA" ]] || { echo "::error::Backup checkout does not match exact target SHA"; exit 1; }
          GITHUB_SHA="${BRVTAL_EXPECTED_SHA}" BRVTAL_FACTORY_ADAPTER_MODE=production bash ops/factory/backup
          {
            echo "## Exact-target production backup"
            echo
            echo "- Source SHA: \`${BRVTAL_EXPECTED_SHA}\`"
            echo "- Adapter: \`ops/factory/backup\`"
            echo "- Result: **ready**"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: controlled-page-write-smoke
    needs: backup
    if: >-
      needs.backup.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirm == 'WRITE_AND_DELETE_TEMP_PAGE') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        vars.BRVTAL_APP_PHASE == 'construction'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke
    env:
      BRVTAL_PROD_URL: https://www.brvtal.com.co
      BRVTAL_PROD_ADMIN_EMAIL: ${{ secrets.BRVTAL_PROD_ADMIN_EMAIL }}
      BRVTAL_PROD_ADMIN_PASSWORD: ${{ secrets.BRVTAL_PROD_ADMIN_PASSWORD }}
      BRVTAL_PROD_TOTP_SECRET: ${{ secrets.BRVTAL_PROD_TOTP_SECRET }}
      BRVTAL_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      BRVTAL_PROD_PAGE_WRITE_CONFIRM: ${{ github.event_name == 'workflow_run' && 'WRITE_AND_DELETE_TEMP_PAGE' || inputs.confirm }}
      BRVTAL_PROD_PAGE_WRITE_MODE: ${{ github.event_name == 'workflow_run' && 'automatic-construction' || 'manual' }}
      BRVTAL_PROD_PAGE_WRITE_OUTPUT: artifacts/production-page-write-smoke.json

    steps:
      - name: Check out exact observed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Require isolated smoke credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BRVTAL_PROD_ADMIN_EMAIL}" || -z "${BRVTAL_PROD_ADMIN_PASSWORD}" ]]; then
            echo "Configure BRVTAL_PROD_ADMIN_EMAIL and BRVTAL_PROD_ADMIN_PASSWORD in the production-smoke environment." >&2
            exit 1
          fi
          if [[ "${BRVTAL_PROD_PAGE_WRITE_CONFIRM}" != "WRITE_AND_DELETE_TEMP_PAGE" ]]; then
            echo "Controlled production write confirmation was not supplied." >&2
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-production-page-write-smoke-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-production-page-write-smoke-npm-
            ${{ runner.os }}-npm-

      - name: Install test dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-production-page-write-smoke-chromium-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-production-page-write-smoke-chromium-
            ${{ runner.os }}-playwright-chromium-

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run controlled Page write smoke
        run: node tests/e2e/production-page-write-smoke.mjs

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Controlled production Page write smoke"
            echo
            echo "- Canonical origin: \`${BRVTAL_PROD_URL}\`"
            echo "- Source SHA: \`${BRVTAL_EXPECTED_SHA}\`"
            echo "- Mode: **${BRVTAL_PROD_PAGE_WRITE_MODE} / authenticated / one temporary published Page / mandatory cleanup**"
            echo "- Check: #122 valid \`content_json\` persistence through the real production API"
            echo "- Evidence: \`production-page-write-smoke.json\` artifact"
            echo
            echo "The probe uses a unique \`production-smoke-122-...\` slug, verifies persistence, deletes only the ID it just created, and confirms that ID returns 404 afterward."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-page-write-smoke-${{ github.run_id }}
          path: artifacts/production-page-write-smoke.json
          if-no-files-found: warn
          retention-days: 14
