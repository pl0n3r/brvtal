name: Ticketing T07 Wompi MariaDB
on:
  pull_request:
    branches: [main]
    paths:
      - config/ticketing_wompi_client.php
      - api/ticketing/checkout.php
      - tests/ticketing-wompi-client-contract.php
      - .github/workflows/ticketing-wompi.yml
permissions:
  contents: read
jobs:
  ticketing-wompi:
    name: ticketing-wompi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: ghcr.io/mariadb/mariadb:11.4.13-noble@sha256:3cff57293253c640483e8a19ce506cf68bf8e4529385e64aeec700c02038e7ed
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_ci
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP 8.5 + PDO MySQL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          ini-file: production
      - name: Probar Wompi mock, importe, idempotencia y TTL en MariaDB descartable
        run: |
          set -euo pipefail
          php -l config/ticketing_wompi_client.php
          php -l api/ticketing/checkout.php
          php -l tests/ticketing-wompi-client-contract.php
          php tests/ticketing-wompi-client-contract.php
