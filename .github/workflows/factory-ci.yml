name: Factory CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  factory-ci:
    uses: pl0n3r/factory/.github/workflows/ci.yml@v1
    with:
      stack: php
      domain: https://www.brvtal.com.co
      version_source: config/version.php
      label_language: en
      phase: live
      php_version: '8.5'
      node_enabled: false
      working_directory: .

  concept05-images-contract:
    name: Concept 05 images contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; same pin as ci-backlog-reconciliation.yml
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checkout is the exact PR HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "::error::Concept 05 test checkout does not match PR HEAD"
            exit 1
          }
      - name: Detect image contract on this commit
        id: image_contract
        shell: bash
        run: |
          if [[ -f tests/test_concept05_generated_images.py ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Concept 05 acceptance not yet present::No image acceptance test in this PR HEAD; this job does not certify AC-01 of BRVTAL #1348.'
          fi
      - name: Decode and validate all five generated images with Pillow
        if: steps.image_contract.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/concept05-venv"
          "${RUNNER_TEMP}/concept05-venv/bin/python" -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          "${RUNNER_TEMP}/concept05-venv/bin/python" -m unittest discover -s tests -p 'test_concept05_generated_images.py' -v
