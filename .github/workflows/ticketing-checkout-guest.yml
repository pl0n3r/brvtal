name: Ticketing guest checkout MariaDB
on:
  pull_request:
    branches: [main]
    paths:
      - config/public_ticket_checkout.php
      - config/buyer_auth.php
      - config/buyer_account.php
      - buyer/index.php
      - tests/integration/ticketing-checkout-guest.php
      - config/public_order_status.php
      - api/ticketing/order-status.php
      - tests/integration/public-order-status.php
      - buyer/purchase.php
      - js/public-order-status.js
      - css/public-ticket-view.css
      - tests/e2e/public-order-status.spec.mjs
      - .github/workflows/ticketing-checkout-guest.yml
permissions:
  contents: read
jobs:
  ticketing-checkout-guest:
    name: ticketing-checkout-guest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: ghcr.io/mariadb/mariadb:11.4.13-noble@sha256:3cff57293253c640483e8a19ce506cf68bf8e4529385e64aeec700c02038e7ed
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_ci
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP 8.5 + PDO MySQL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          ini-file: production
      - name: Probar compra sin sesión, comprador invitado y estado por token en MariaDB descartable
        run: |
          set -euo pipefail
          php -l config/public_ticket_checkout.php
          php -l tests/integration/ticketing-checkout-guest.php
          php tests/integration/ticketing-checkout-guest.php
          php -l config/public_order_status.php
          php -l api/ticketing/order-status.php
          php tests/integration/public-order-status.php

  purchase-visual-evidence:
    name: "Compra y Mi cuenta: capturas 390/1440 antes/después"
    if: github.event.pull_request.number == 1959 || github.event.pull_request.number == 2004
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install browser test dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Verify Chromium runtime
        run: |
          npx playwright install chromium
          if ! node --input-type=module - <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          await browser.close();
          JS
          then
            npx playwright install-deps chromium
          fi
      - name: Generate synthetic before/after purchase screenshots
        env:
          BRVTAL_VISUAL_EVIDENCE: artifacts/checkout-1958
        run: npx playwright test tests/e2e/public-order-status.spec.mjs --project=chromium --workers=1 --reporter=list
      - name: Verify exact-HEAD purchase and buyer-account captures
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          folder = Path('artifacts/checkout-1958')
          number = int(os.environ['EXPECTED_PR'])
          assert number in (1959, 2004)
          names = ['compra-antes-390.png', 'compra-despues-390.png',
                   'compra-antes-1440.png', 'compra-despues-1440.png']
          if number == 2004:
              names.extend(['cuenta-compra-limitada-390.png', 'cuenta-compra-limitada-1440.png'])
          for name in names:
              path = folder / name
              assert path.is_file() and path.stat().st_size > 1000, f'Missing visual evidence: {name}'
          (folder / 'manifest.json').write_text(json.dumps({
              'issue': 1988 if number == 2004 else 1958,
              'head_sha': os.environ['EXPECTED_HEAD'],
              'before_fixture': 'buyer/login.php',
              'after_fixture': 'buyer/purchase.php and buyer/index.php' if number == 2004 else 'buyer/purchase.php',
              'production_observed': False, 'captures': names,
          }, indent=2) + '\n')
          PY
      - name: Publish visual evidence at exact HEAD
        id: screenshots
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-${{ github.event.pull_request.number == 2004 && '1988-account' || '1958-purchase' }}-before-after-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/checkout-1958/
          if-no-files-found: error
          retention-days: 14
      - name: Link visual evidence for review
        if: success() && steps.screenshots.outputs.artifact-url != ''
        env:
          EVIDENCE_URL: ${{ steps.screenshots.outputs.artifact-url }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            if [ "$PR_NUMBER" = "2004" ]; then
              echo "## #1988 · Compra y Mi cuenta: 390 y 1440 px"
            else
              echo "## #1958 · Compra: antes/después 390 y 1440 px"
            fi
            echo
            echo "Antes = login anterior; después = confirmación y, para #1988, compras del navegador original."
            echo "Capturas sintéticas de Playwright, no evidencia de producción."
            echo "HEAD: `$EXACT_HEAD`"
            echo
            echo "[Descargar capturas PNG y manifiesto del HEAD exacto]($EVIDENCE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
