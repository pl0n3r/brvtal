name: Backup Recovery Rehearsal
run-name: Backup Recovery Rehearsal #${{ github.run_number }} · ${{ github.event_name }}

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/backup-recovery-rehearsal.yml'
      - 'tests/integration/backup-recovery-rehearsal.php'
      - 'tests/backup-recovery-rehearsal-contract.php'
      - 'config/backups.php'
      - 'discadmin/backups.php'
      - 'docs/TESTING.md'
      - 'AGENTS.md'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-recovery-rehearsal.yml'
      - 'tests/integration/backup-recovery-rehearsal.php'
      - 'tests/backup-recovery-rehearsal-contract.php'
      - 'config/backups.php'
      - 'discadmin/backups.php'
      - 'docs/TESTING.md'
      - 'AGENTS.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvtal-backup-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_backup_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_BACKUP_RECOVERY_REHEARSAL: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_backup_source
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
      BRVTAL_BACKUP_RECOVERY_OUTPUT: artifacts/backup-recovery-rehearsal.json

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.5 with recovery extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip
          coverage: none
          ini-file: production

      - name: Verify PHP 8.5 runtime
        run: php -r 'if (PHP_VERSION_ID < 80500 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Expected PHP 8.5.x; got " . PHP_VERSION . PHP_EOL); exit(1); } echo "PHP " . PHP_VERSION . PHP_EOL;'

      - name: Validate rehearsal source and safety contract
        run: |
          php -l tests/integration/backup-recovery-rehearsal.php
          php -l tests/backup-recovery-rehearsal-contract.php
          php tests/backup-recovery-rehearsal-contract.php

      - name: Run isolated backup recovery rehearsal
        run: php tests/integration/backup-recovery-rehearsal.php

      - name: Publish rehearsal summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backup recovery rehearsal"
            echo
            echo "- Source: disposable MariaDB database \`brvtal_test_backup_source\`"
            echo "- Recovery: unique \`brvtal_test_recovery_*\` database created and dropped inside this job"
            echo "- Scope: database dump + foreign keys + view + media ZIP snapshot"
            echo "- Production restore: **DISABLED / NOT TOUCHED**"
            echo "- Evidence: \`backup-recovery-rehearsal.json\` artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-recovery-rehearsal-${{ github.run_id }}
          path: artifacts/backup-recovery-rehearsal.json
          if-no-files-found: warn
          retention-days: 14
