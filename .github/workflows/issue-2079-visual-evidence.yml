name: BRVTAL 2079 public form visual evidence
on:
  pull_request:
    branches: [main]
    paths: [tests/e2e/public-forms.spec.mjs, .github/workflows/issue-2079-visual-evidence.yml]
permissions:
  contents: read
jobs:
  forms-2079-visual:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/issue-2079'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -euo pipefail
          base="$RUNNER_TEMP/forms-2079-base"
          git worktree add --detach "$base" "$BASE_SHA"
          test "$(git -C "$base" rev-parse HEAD)" = "$BASE_SHA" && test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          BRVTAL_PUBLIC_FORMS_BASE_ROOT="$base" npx playwright test tests/e2e/public-forms.spec.mjs --project=chromium --workers=1
          cd artifacts/forms-2079
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$HEAD_SHA" > manifest.txt
          for stage in before after; do for width in 390 1440; do test -s "$stage-$width.png"; base64 -w 1200 "$stage-$width.jpg" | sed "s/^/VISUAL-$stage-$width:/"; done; done
          sha256sum *.png *.jpg >> manifest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-2079-visual-${{ github.event.pull_request.head.sha }}
          path: artifacts/forms-2079/
          if-no-files-found: error
          retention-days: 14
