name: Static Image Candidate Lab

on:
  push:
    branches: ["perf/static-image-candidates"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    name: candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install image tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick webp
          cwebp -version

      - name: Build and score WebP candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/static-image-candidates
          report="artifacts/static-image-candidates/report.tsv"
          printf 'asset\tsource_width\tsource_height\tcandidate_width\tquality\tbytes\tpsnr_db\n' > "$report"

          score_candidates() {
            local label="$1"
            local src="$2"
            shift 2
            local dims source_w source_h
            dims=$(identify -format '%w %h' "$src")
            read -r source_w source_h <<< "$dims"
            echo "SOURCE $label: ${source_w}x${source_h}, $(stat -c%s "$src") bytes"

            for width in "$@"; do
              if (( width > source_w )); then
                continue
              fi
              local ref="/tmp/${label}-${width}-reference.png"
              convert "$src" -auto-orient -resize "${width}x>" -strip "$ref"
              for quality in 82 86 90 92; do
                local out="artifacts/static-image-candidates/${label}-${width}-q${quality}.webp"
                cwebp -quiet -mt -m 6 -sharp_yuv -q "$quality" -resize "$width" 0 "$src" -o "$out"
                local bytes psnr
                bytes=$(stat -c%s "$out")
                psnr=$(compare -metric PSNR "$ref" "$out" null: 2>&1 || true)
                printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$label" "$source_w" "$source_h" "$width" "$quality" "$bytes" "$psnr" >> "$report"
              done
            done
          }

          score_candidates logo assets/brvtal-logo.jpeg 512 640 768 886
          score_candidates genesis assets/flyers/F60DFB48-3DB5-4E3E-B627-BF1B8129EB1D_1_105_c.jpeg 512 640 768 886

          echo '### Candidate matrix' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```tsv' >> "$GITHUB_STEP_SUMMARY"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-image-candidates-${{ github.run_id }}
          path: artifacts/static-image-candidates/
          retention-days: 7
