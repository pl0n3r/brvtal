name: Static Image Candidate Lab

on:
  push:
    branches: ["perf/static-image-candidates"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    name: materialize
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/static-image-candidates

      - name: Install WebP tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y webp

      - name: Generate selected derivatives
        shell: bash
        run: |
          set -euo pipefail
          cwebp -quiet -mt -m 6 -sharp_yuv -q 82 -resize 640 0 assets/brvtal-logo.jpeg -o assets/brvtal-logo-640.webp
          cwebp -quiet -mt -m 6 -sharp_yuv -q 82 -resize 886 0 assets/brvtal-logo.jpeg -o assets/brvtal-logo-886.webp
          cwebp -quiet -mt -m 6 -sharp_yuv -q 82 -resize 640 0 assets/flyers/F60DFB48-3DB5-4E3E-B627-BF1B8129EB1D_1_105_c.jpeg -o assets/flyers/genesis-640.webp
          cwebp -quiet -mt -m 6 -sharp_yuv -q 82 -resize 886 0 assets/flyers/F60DFB48-3DB5-4E3E-B627-BF1B8129EB1D_1_105_c.jpeg -o assets/flyers/genesis-886.webp
          ls -lh assets/brvtal-logo-*.webp assets/flyers/genesis-*.webp

      - name: Commit generated derivatives to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brvtal-logo-640.webp assets/brvtal-logo-886.webp assets/flyers/genesis-640.webp assets/flyers/genesis-886.webp
          if git diff --cached --quiet; then
            echo "Selected derivatives are already current."
            exit 0
          fi
          git commit -m "perf: add selected static WebP derivatives [generated-assets]"
          git push origin HEAD:perf/static-image-candidates
