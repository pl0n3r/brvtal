name: BRVTAL #1863 dashboard editorial visual evidence

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'discadmin/dashboard-v2.js'
      - 'discadmin/dashboard-v2.css'
      - 'tests/e2e/discadmin-dashboard-editorial.spec.mjs'
      - '.github/workflows/issue-1863-visual-evidence.yml'

permissions:
  contents: read

jobs:
  captures:
    if: github.repository == 'pl0n3r/brvtal' && github.event.pull_request.number == 1895
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Capture real browser screenshots using synthetic editorial fixtures
        run: npx playwright test tests/e2e/discadmin-dashboard-editorial.spec.mjs --project=chromium --reporter=list
      - name: Attach four exact-head before and after screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-1863-dashboard-visual-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            test-results/public-concept05-fidelity-dashboard-1863/before-390.png
            test-results/public-concept05-fidelity-dashboard-1863/after-390.png
            test-results/public-concept05-fidelity-dashboard-1863/before-1440.png
            test-results/public-concept05-fidelity-dashboard-1863/after-1440.png
          if-no-files-found: error
          retention-days: 14
