name: BRVTAL 2068 visual evidence
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'discadmin/forms.php'
      - 'discadmin/forms.js'
      - 'discadmin/admin-information-architecture.js'
      - 'discadmin/index-core.php'
      - 'tests/e2e/discadmin-forms.spec.mjs'
      - '.github/workflows/issue-2068-visual-evidence.yml'
permissions:
  contents: read
jobs:
  forms-2068-visual:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/issue-2068'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRVTAL_FORMS_VISUAL_BASE: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture exact sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BRVTAL_FORMS_VISUAL_BASE^{commit}"
          npx playwright test tests/e2e/discadmin-forms.spec.mjs --project=chromium --workers=1
          cd artifacts/forms-2068
          printf 'base=%s\nhead=%s\n' "$BRVTAL_FORMS_VISUAL_BASE" "$HEAD_SHA" > manifest.txt
          for stage in before after; do for width in 390 1440; do test -s "$stage-$width.png"; done; done
          sha256sum *.png >> manifest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brvtal-2068-visual-${{ env.HEAD_SHA }}
          path: artifacts/forms-2068/
          if-no-files-found: error
          retention-days: 14
