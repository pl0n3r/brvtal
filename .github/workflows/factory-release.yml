name: Factory Release

on:
  push:
    branches: [main]
    paths:
      - config/version.php

permissions:
  contents: write

jobs:
  release:
    uses: pl0n3r/factory/.github/workflows/release.yml@v1
    with:
      version_source: config/version.php
      version_format: php-const
      version_key: BRVTAL_APP_VERSION
