name: T24 POS synthetic MariaDB
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ticketing-pos.yml
      - database/migration_ticketing_pos_01.sql
      - config/ticketing_pos.php
      - config/ticketing_checkin.php
      - config/migration_reconcile.php
      - api/ticketing/admin-pos.php
      - discadmin/ticketing-pos.js
      - discadmin/ticketing-finance.js
      - tests/integration/ticketing-pos.php
      - tests/e2e/discadmin-ticketing-pos.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pos-mariadb:
    name: pos-mariadb
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: ghcr.io/mariadb/mariadb:11.4.13-noble@sha256:3cff57293253c640483e8a19ce506cf68bf8e4529385e64aeec700c02038e7ed
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_ci
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
    steps:
      - name: Exact checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP 8.5 with PDO MySQL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          ini-file: production
      - name: Verify POS against disposable MariaDB and exact migrations
        run: |
          set -euo pipefail
          php -l config/ticketing_pos.php
          php -l config/ticketing_checkin.php
          php -l config/migration_reconcile.php
          php -l api/ticketing/admin-pos.php
          php -l tests/integration/ticketing-pos.php
          php tests/migrations-contract.php
          php tests/integration/ticketing-pos.php
