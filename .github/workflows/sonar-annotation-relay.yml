name: Sonar Annotation Relay

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      check_run_id:
        description: GitHub check run ID to relay
        required: true
        type: string
      pr_number:
        description: Pull request number receiving the relay comment
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  relay:
    name: relay
    if: github.event_name == 'workflow_dispatch' || github.event.check_run.name == 'SonarCloud Code Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: Publish Sonar annotations to the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          MANUAL_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_root = "https://api.github.com"
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          event_name = os.environ["GH_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))

          def api(method, path, payload=None):
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "brvtal-sonar-annotation-relay",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {error.code} {detail}") from error

          if event_name == "workflow_dispatch":
              check_run_id = int(os.environ["MANUAL_CHECK_RUN_ID"])
              pr_number = int(os.environ["MANUAL_PR_NUMBER"])
              check_run = api("GET", f"/repos/{repository}/check-runs/{check_run_id}")
          else:
              check_run = event["check_run"]
              check_run_id = int(check_run["id"])
              pull_requests = check_run.get("pull_requests") or []
              pr_number = int(pull_requests[0]["number"]) if pull_requests else 0

          if check_run.get("name") != "SonarCloud Code Analysis":
              print(f"Ignoring non-Sonar check: {check_run.get('name')}")
              raise SystemExit(0)

          head_sha = str(check_run.get("head_sha") or "")
          if pr_number == 0 and head_sha:
              associated = api(
                  "GET",
                  f"/repos/{repository}/commits/{urllib.parse.quote(head_sha)}/pulls?per_page=100",
              ) or []
              open_prs = [item for item in associated if item.get("state") == "open"]
              if open_prs:
                  pr_number = int(open_prs[0]["number"])

          if pr_number == 0:
              print(f"No pull request is associated with Sonar check {check_run_id}; nothing to relay.")
              raise SystemExit(0)

          annotations = []
          page = 1
          while True:
              batch = api(
                  "GET",
                  f"/repos/{repository}/check-runs/{check_run_id}/annotations?per_page=100&page={page}",
              ) or []
              annotations.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def clean(value, limit=900):
              text = " ".join(str(value or "").split())
              text = text.replace("@", "@\\u200b").replace(chr(96), "'")
              return text[:limit]

          marker = "<!-- brvtal-sonar-annotations -->"
          lines = [
              marker,
              "## Sonar annotations relay",
              "",
              f"- Check run: {check_run_id}",
              f"- Head: {head_sha or 'unknown'}",
              f"- Conclusion: {check_run.get('conclusion') or 'unknown'}",
              f"- Annotations: **{len(annotations)}**",
              "",
          ]

          if not annotations:
              lines.append("No line annotations were reported by this Sonar check.")
          else:
              visible = annotations[:50]
              for index, annotation in enumerate(visible, 1):
                  path = clean(annotation.get("path"), 300)
                  start = annotation.get("start_line")
                  end = annotation.get("end_line")
                  location = path
                  if start:
                      location += f":{start}"
                      if end and end != start:
                          location += f"-{end}"
                  level = clean(annotation.get("annotation_level") or "notice", 30).upper()
                  title = clean(annotation.get("title"), 300)
                  message = clean(annotation.get("message"), 1000)
                  heading = f"{index}. **{level}** {location}"
                  if title:
                      heading += f" — {title}"
                  lines.extend([heading, f"   {message}", ""])
              if len(annotations) > len(visible):
                  lines.append(f"_Showing first {len(visible)} of {len(annotations)} annotations._")

          body = "\\n".join(lines).strip() + "\\n"

          comments = api("GET", f"/repos/{repository}/issues/{pr_number}/comments?per_page=100") or []
          existing = next(
              (
                  comment for comment in comments
                  if marker in str(comment.get("body") or "")
                  and str((comment.get("user") or {}).get("login") or "").endswith("[bot]")
              ),
              None,
          )

          if existing:
              api(
                  "PATCH",
                  f"/repos/{repository}/issues/comments/{existing['id']}",
                  {"body": body},
              )
              print(f"Updated Sonar annotation relay comment on PR #{pr_number}.")
          else:
              api(
                  "POST",
                  f"/repos/{repository}/issues/{pr_number}/comments",
                  {"body": body},
              )
              print(f"Created Sonar annotation relay comment on PR #{pr_number}.")
          PY
