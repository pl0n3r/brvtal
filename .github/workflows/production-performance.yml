name: Production Performance
run-name: Production Performance #${{ github.run_number }} · ${{ github.event_name }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["BRVTAL CI", "Production Deploy Observer"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: brvtal-production-performance-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: measure
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BRVTAL_PERF_URL: https://www.brvtal.com.co/

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - name: Confirm automatic measurement prerequisites
        if: github.event_name == 'workflow_run'
        id: prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SOURCE_WORKFLOW" == "BRVTAL CI" ]]; then
            counterpart_file="production-deploy-observer.yml"
            counterpart_name="Production Deploy Observer"
          else
            counterpart_file="update-release-metadata.yml"
            counterpart_name="BRVTAL CI"
          fi

          decision=$(
            gh api "repos/$GH_REPO/actions/workflows/$counterpart_file/runs?head_sha=$EXPECTED_SHA&event=push&per_page=20" |
              python scripts/production-performance-prerequisite.py \
                --expected-sha "$EXPECTED_SHA" \
                --source-run-id "$SOURCE_RUN_ID" \
                --source-updated-at "$SOURCE_UPDATED_AT"
          )
          ready=$(jq -r '.ready' <<<"$decision")
          reason=$(jq -r '.reason' <<<"$decision")
          counterpart_status=$(jq -r '.counterpart_status' <<<"$decision")
          counterpart_conclusion=$(jq -r '.counterpart_conclusion' <<<"$decision")
          counterpart_run_id=$(jq -r '.counterpart_run_id // empty' <<<"$decision")
          counterpart_updated_at=$(jq -r '.counterpart_updated_at // empty' <<<"$decision")
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

          {
            echo "## Automatic production-performance prerequisites"
            echo
            echo "- Trigger completed: **$SOURCE_WORKFLOW**"
            echo "- Same-SHA counterpart: **$counterpart_name**"
            echo "- Main SHA: \`$EXPECTED_SHA\`"
            echo "- Decision: \`$reason\`"
            if [[ -n "$counterpart_run_id" ]]; then
              echo "- Counterpart run: \`$counterpart_run_id\` · **$counterpart_status / $counterpart_conclusion** · $counterpart_updated_at"
            else
              echo "- Counterpart run: **not available for this SHA yet**"
            fi
            if [[ "$ready" == "true" ]]; then
              echo "- Status: **READY — this is the single automatic measurement owner for the SHA**"
            else
              echo "- Status: **NOT READY — this coordination run will not measure production**"
              echo "- Ownership belongs to the later successful prerequisite completion; ties use the larger run id."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production connectivity
        if: github.event_name == 'workflow_dispatch' || steps.prerequisites.outputs.ready == 'true'
        id: connectivity
        shell: bash
        run: |
          set -euo pipefail
          reachable=false

          for attempt in $(seq 1 3); do
            if curl -fsSL -o /dev/null \
              --connect-timeout 3 \
              --max-time 6 \
              -H 'Cache-Control: no-cache' \
              "$BRVTAL_PERF_URL"; then
              reachable=true
              echo "Production reachable on attempt $attempt."
              break
            fi

            echo "Production not reachable yet (attempt $attempt/3)."
            if [[ "$attempt" -lt 3 ]]; then
              sleep 2
            fi
          done

          echo "reachable=$reachable" >> "$GITHUB_OUTPUT"

          if [[ "$reachable" != "true" ]]; then
            {
              echo "## Production connectivity"
              echo
              echo "- Canonical URL: \`$BRVTAL_PERF_URL\`"
              echo "- Status: **INCONCLUSIVE — UNREACHABLE FROM THIS RUNNER**"
              echo "- No performance measurement was executed, so this run is not a measured performance regression."
              echo "- Re-run manually when production is reachable from a GitHub runner."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Production is unreachable from this GitHub runner; performance measurement is inconclusive."
          fi


      - name: Set up Node 24
        if: steps.connectivity.outputs.reachable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache npm downloads
        if: steps.connectivity.outputs.reachable == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-production-performance-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-production-performance-npm-
            ${{ runner.os }}-npm-

      - name: Install test dependencies
        if: steps.connectivity.outputs.reachable == 'true'
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Cache Chromium
        if: steps.connectivity.outputs.reachable == 'true'
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-production-performance-chromium-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-production-performance-chromium-
            ${{ runner.os }}-playwright-chromium-

      - name: Install Chromium system dependencies
        if: steps.connectivity.outputs.reachable == 'true'
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.connectivity.outputs.reachable == 'true' && steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Measure mobile production performance
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          BRVTAL_PERF_MODE: mobile
          BRVTAL_PERF_OUTPUT: artifacts/production-performance-mobile.json
        run: node tests/e2e/production-performance-probe.mjs

      - name: Measure desktop production performance
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          BRVTAL_PERF_MODE: desktop
          BRVTAL_PERF_OUTPUT: artifacts/production-performance-desktop.json
        run: node tests/e2e/production-performance-probe.mjs

      - name: Normalize Factory Performance v1 evidence
        if: github.event_name == 'workflow_run' && steps.prerequisites.outputs.ready == 'true' && steps.connectivity.outputs.reachable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          release="$(sed -nE "s/^const BRVTAL_APP_VERSION = '([^']+)';$/\1/p" config/version.php)"
          python3 scripts/production-performance-evidence.py             --sha "$sha"             --release "$release"             --run-id "$GITHUB_RUN_ID"

      - name: Upload performance evidence
        if: success() && steps.connectivity.outputs.reachable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-performance-${{ github.run_id }}
          path: artifacts/production-performance-*.json
          if-no-files-found: error
          retention-days: 14
