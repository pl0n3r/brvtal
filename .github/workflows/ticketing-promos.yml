# T23: disposable MariaDB checks only. No Hostinger, payment, deploy or secrets.
name: Ticketing T23 Promos MariaDB
on:
  pull_request:
    paths:
      - '.github/workflows/ticketing-promos.yml'
      - 'config/ticketing_promos.php'
      - 'api/ticketing/admin-promos.php'
      - 'database/migration_ticketing_promos_01.sql'
      - 'tests/integration/ticketing-promos.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ticketing-promos.yml'
      - 'config/ticketing_promos.php'
      - 'api/ticketing/admin-promos.php'
      - 'database/migration_ticketing_promos_01.sql'
      - 'tests/integration/ticketing-promos.php'
permissions:
  contents: read
jobs:
  promos-mariadb:
    name: T23 MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: ghcr.io/mariadb/mariadb:11.4.13-noble@sha256:3cff57293253c640483e8a19ce506cf68bf8e4529385e64aeec700c02038e7ed
        env:
          MARIADB_ROOT_PASSWORD: brvtal_root
          MARIADB_DATABASE: brvtal_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      BRVTAL_INTEGRATION_TESTS: '1'
      BRVTAL_TEST_DB_HOST: 127.0.0.1
      BRVTAL_TEST_DB_PORT: '3306'
      BRVTAL_TEST_DB_NAME: brvtal_test_ci
      BRVTAL_TEST_DB_USER: root
      BRVTAL_TEST_DB_PASS: brvtal_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP 8.5 with MariaDB
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          ini-file: production
      - name: Exercise T23 promotions against disposable MariaDB
        run: php tests/integration/ticketing-promos.php
