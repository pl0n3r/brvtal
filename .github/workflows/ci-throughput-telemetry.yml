name: CI Throughput Telemetry

on:
  workflow_run:
    workflows: ["BRVTAL CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-throughput-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out observed source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Collect critical-path telemetry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SOURCE_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --slurp > artifacts/job-pages.json
          python scripts/ci-throughput-report.py \
            --input artifacts/job-pages.json \
            --output artifacts/ci-throughput.json \
            --summary artifacts/ci-throughput-summary.md \
            --run-id "$RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --event "$SOURCE_EVENT" \
            --conclusion "$SOURCE_CONCLUSION" \
            --started-at "$SOURCE_STARTED_AT" \
            --updated-at "$SOURCE_UPDATED_AT"
          cat artifacts/ci-throughput-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload throughput evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-throughput-${{ github.event.workflow_run.id }}
          path: artifacts/ci-throughput.json
          retention-days: 30
