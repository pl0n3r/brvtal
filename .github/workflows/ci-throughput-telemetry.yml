name: CI Throughput Telemetry

on:
  workflow_run:
    workflows: ["BRVTAL CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-throughput-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Collect critical-path telemetry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SOURCE_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --slurp > artifacts/job-pages.json
          jq -n \
            --arg run_id "$RUN_ID" \
            --arg sha "$SOURCE_SHA" \
            --arg event "$SOURCE_EVENT" \
            --arg conclusion "$SOURCE_CONCLUSION" \
            --arg started "$SOURCE_STARTED_AT" \
            --arg updated "$SOURCE_UPDATED_AT" \
            --slurpfile pages artifacts/job-pages.json '
              def seconds($a; $b):
                if ($a == null or $b == null) then null
                else (($b | fromdateiso8601) - ($a | fromdateiso8601))
                end;
              [$pages[0][] | .jobs[]] as $jobs |
              [$jobs[] | {
                name,
                conclusion,
                started_at,
                completed_at,
                duration_seconds: seconds(.started_at; .completed_at)
              }] as $timings |
              ($timings | map(select(.duration_seconds != null))) as $completed |
              ($conclusion == "success") as $critical_path_eligible |
              ($completed | map(select(.conclusion == "success" and .name != "preflight" and .name != "validate"))) as $parallel_gates |
              ($parallel_gates | if length > 0 then max_by(.duration_seconds) else null end) as $critical_gate |
              ($completed | map(select(.name == "preflight")) | .[0] // null) as $preflight |
              ($completed | map(select(.name == "validate")) | .[0] // null) as $validate |
              (if $critical_path_eligible
               then ([$preflight, $critical_gate, $validate] | map(select(. != null)))
               else []
               end) as $critical_jobs |
              {
                run_id: ($run_id | tonumber),
                source_sha: $sha,
                event: $event,
                conclusion: $conclusion,
                workflow_started_at: $started,
                workflow_updated_at: $updated,
                workflow_wall_seconds: seconds($started; $updated),
                critical_path: {
                  eligible: $critical_path_eligible,
                  jobs: ($critical_jobs | map(.name)),
                  duration_seconds: ($critical_jobs | map(.duration_seconds) | add)
                },
                jobs: $timings
              }
            ' > artifacts/ci-throughput.json

          {
            echo "# BRVTAL CI throughput"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Source result: **$SOURCE_CONCLUSION**"
            echo "- Workflow wall time: **$(jq -r '.workflow_wall_seconds // "n/a"' artifacts/ci-throughput.json)s**"
            echo "- Critical path: **$(jq -r 'if (.critical_path.jobs | length) > 0 then (.critical_path.jobs | join(" → ")) else "n/a" end' artifacts/ci-throughput.json)** ($(jq -r 'if .critical_path.duration_seconds == null then "n/a" else "\(.critical_path.duration_seconds)s" end' artifacts/ci-throughput.json))"
            echo
            echo "| Job | Result | Duration |"
            echo "|---|---|---:|"
            jq -r '.jobs[] | "| \(.name) | \(.conclusion // "n/a") | \(.duration_seconds // "n/a")s |"' artifacts/ci-throughput.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload throughput evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-throughput-${{ github.event.workflow_run.id }}
          path: artifacts/ci-throughput.json
          retention-days: 30
