name: Integrate TOTP Security Navigation

on:
  push:
    branches: [feat/0b-5-totp-optional-impl]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0b-5-totp-optional-impl
          fetch-depth: 0
      - name: Add security entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('discadmin/index.php')
          s=p.read_text()
          if '/discadmin/totp-status.php' not in s:
              patterns=[
                  r'(<button[^>]*>\s*SETTINGS\s*</button>)',
                  r'(<button[^>]*>\s*settings\s*</button>)',
              ]
              replacement=r'''\1\n<button type="button" onclick="window.location.href='/discadmin/totp-status.php'">SECURITY / 2FA</button>'''
              for pat in patterns:
                  s2,n=re.subn(pat,replacement,s,count=1,flags=re.I)
                  if n:
                      s=s2
                      break
              else:
                  raise SystemExit('Could not locate SETTINGS navigation entry')
              p.write_text(s)
          PY
      - name: Validate
        run: |
          set -e
          php -l discadmin/index.php
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'BRVTAL Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discadmin/index.php
          git commit -m 'feat: add DISCADMIN security navigation'
          git push origin feat/0b-5-totp-optional-impl
